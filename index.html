<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>PDF 翻译阅读器</title>
<link rel="manifest" href="manifest.json">
<style>
:root {
    --bg: #f5f6fa; --card: #fff; --primary: #6366f1; --primary-dark: #4f46e5;
    --text: #1e293b; --muted: #94a3b8; --border: #e2e8f0;
    --safe-b: env(safe-area-inset-bottom, 0px);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; -webkit-text-size-adjust: 100%; }
html, body { margin: 0; padding: 0; height: 100%; overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Segoe UI", Roboto, sans-serif;
    background: var(--bg); color: var(--text); }
body { display: flex; flex-direction: column; }

#toolbar { display: flex; align-items: center; gap: 6px; padding: 8px 8px;
    padding-top: calc(8px + env(safe-area-inset-top, 0px));
    background: var(--card); border-bottom: 1px solid var(--border);
    flex-shrink: 0; z-index: 50; }
#toolbar .spacer { flex: 1; }
.tool-btn { border: none; background: #eef2ff; color: var(--primary-dark);
    font-size: 13px; font-weight: 600; padding: 7px 10px; border-radius: 8px;
    cursor: pointer; white-space: nowrap; font-family: inherit; }
.tool-btn.primary { background: var(--primary); color: #fff; }
.tool-btn.active { background: #16a34a; color: #fff; }
.tool-btn:active { opacity: 0.75; }
#file-input { display: none; }
#status { font-size: 11px; color: var(--muted); overflow: hidden;
    text-overflow: ellipsis; white-space: nowrap; min-width: 0; max-width: 80px; }
#zoom-label { font-size: 11px; color: var(--muted); min-width: 32px; text-align: center; }
.zoom-btn { width: 30px; height: 32px; padding: 0; font-size: 17px;
    display: inline-flex; align-items: center; justify-content: center; }

#viewer-container { flex: 1; overflow: auto; position: relative;
    -webkit-overflow-scrolling: touch; overscroll-behavior: contain; }
#empty-state { display: flex; flex-direction: column; align-items: center;
    justify-content: center; height: 100%; padding: 40px 28px; text-align: center;
    color: var(--muted); gap: 10px; }
#empty-state .empty-icon { font-size: 56px; opacity: 0.35; }
#empty-state h2 { font-size: 18px; font-weight: 700; color: #64748b; margin: 0; }
#empty-state p { font-size: 14px; line-height: 1.7; margin: 0; max-width: 300px; }

#pdf-pages { display: flex; flex-direction: column; align-items: center;
    gap: 12px; width: max-content; min-width: 100%; padding: 8px; }
.page-wrapper { position: relative; background: #fff;
    box-shadow: 0 2px 12px rgba(0,0,0,0.08); border-radius: 2px;
    overflow: hidden; flex-shrink: 0; }
.page-wrapper canvas { display: block; }

.text-layer { position: absolute; left: 0; top: 0; overflow: hidden;
    line-height: 1; pointer-events: none; user-select: none; -webkit-user-select: none; z-index: 1; }
.text-layer span { position: absolute; color: transparent; white-space: pre;
    transform-origin: 0% 0%; padding: 0; margin: 0; }

.hl-box { position: absolute; background: rgba(99,102,241,0.25); border-radius: 2px; z-index: 2; pointer-events: none; }
.hl-box.start { background: rgba(22,163,74,0.4); }

.page-loading { position: absolute; inset: 0; display: flex; align-items: center;
    justify-content: center; color: var(--muted); font-size: 13px; }

#drawer-mask { position: fixed; inset: 0; background: rgba(15,23,42,0.28);
    opacity: 0; pointer-events: none; transition: opacity 0.25s; z-index: 1999; }
#drawer-mask.visible { opacity: 1; pointer-events: auto; }

#translation-panel { position: fixed; left: 0; right: 0; bottom: 0; z-index: 2000;
    background: var(--card); border-radius: 18px 18px 0 0;
    box-shadow: 0 -6px 32px rgba(0,0,0,0.16); transform: translateY(105%);
    transition: transform 0.3s cubic-bezier(0.32,0.72,0,1); display: flex;
    flex-direction: column; max-height: 58vh; padding-bottom: calc(8px + var(--safe-b)); }
#translation-panel.visible { transform: translateY(0); }
.drawer-handle { width: 36px; height: 4px; border-radius: 2px; background: #cbd5e1;
    margin: 8px auto 2px; flex-shrink: 0; }
.panel-header { display: flex; align-items: center; gap: 10px;
    padding: 2px 16px 8px; flex-shrink: 0; }
.panel-title { font-weight: 700; font-size: 15px; margin-right: auto; }
#target-lang { font-size: 16px; border: 1px solid var(--border); border-radius: 8px;
    padding: 4px 8px; background: #f8fafc; color: var(--text); font-family: inherit;
    max-width: 110px; }
.icon-btn { border: none; background: none; font-size: 18px; color: var(--muted);
    cursor: pointer; padding: 4px 6px; line-height: 1; font-family: inherit; }
.source-box { padding: 10px 16px; background: #f8fafc; font-size: 13px;
    color: #64748b; line-height: 1.6; max-height: 84px; overflow-y: auto;
    flex-shrink: 0; border-top: 1px solid var(--border);
    border-bottom: 1px solid var(--border); word-break: break-word;
    -webkit-overflow-scrolling: touch; }
.result-box { padding: 14px 16px; font-size: 16px; line-height: 1.7;
    overflow-y: auto; flex: 1; min-height: 64px; word-break: break-word;
    white-space: pre-wrap; -webkit-overflow-scrolling: touch; }
.result-box.loading { color: var(--muted); font-style: italic; font-size: 14px; }
.result-box.error { color: #dc2626; font-size: 14px; }
.panel-footer { display: flex; align-items: center; padding: 8px 16px 2px;
    flex-shrink: 0; gap: 8px; }
#engine-label { font-size: 12px; color: var(--muted); margin-right: auto; }
.small-btn { font-size: 13px; padding: 6px 12px; border-radius: 7px;
    border: 1px solid var(--border); background: #fff; color: var(--text);
    cursor: pointer; font-family: inherit; }
.small-btn:active { background: #f1f5f9; }

#toast { position: fixed; left: 50%; bottom: calc(100px + var(--safe-b));
    transform: translateX(-50%) translateY(10px); background: rgba(30,41,59,0.92);
    color: #fff; font-size: 13px; padding: 8px 18px; border-radius: 20px;
    opacity: 0; pointer-events: none; transition: all 0.25s; z-index: 3000;
    max-width: 86vw; text-align: center; }
#toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>

<header id="toolbar">
    <label for="file-input" class="tool-btn primary">导入</label>
    <input type="file" id="file-input" accept="application/pdf,.pdf">
    <button class="tool-btn" id="sel-mode-btn">选段</button>
    <span id="status">选择 PDF</span>
    <div class="spacer"></div>
    <button class="tool-btn zoom-btn" id="zoom-out">−</button>
    <span id="zoom-label">100%</span>
    <button class="tool-btn zoom-btn" id="zoom-in">+</button>
</header>

<main id="viewer-container">
    <div id="empty-state">
        <div class="empty-icon">📄</div>
        <h2>导入 PDF 开始阅读</h2>
        <p>轻点单词翻译；点「选段」后点起点和终点，翻译整段</p>
    </div>
    <div id="pdf-pages"></div>
</main>

<div id="drawer-mask"></div>
<aside id="translation-panel">
    <div class="drawer-handle"></div>
    <div class="panel-header">
        <span class="panel-title">翻译</span>
        <select id="target-lang">
            <option value="zh">中文</option>
            <option value="en">English</option>
            <option value="ja">日本語</option>
            <option value="ko">한국어</option>
            <option value="fr">Français</option>
            <option value="de">Deutsch</option>
            <option value="es">Español</option>
        </select>
        <button class="icon-btn" id="panel-close" aria-label="关闭">✕</button>
    </div>
    <div class="source-box" id="source-text"></div>
    <div class="result-box" id="translation-result"></div>
    <div class="panel-footer">
        <span id="engine-label"></span>
        <button class="small-btn" id="copy-btn">复制译文</button>
    </div>
</aside>

<div id="toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
(function () {
'use strict';

pdfjsLib.GlobalWorkerOptions.workerSrc =
    'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

var MAX_TEXT = 3000;
var DPR = Math.min(window.devicePixelRatio || 1, 3);
var MAX_CANVAS_DIM = 4096;
var MAX_CANVAS_AREA = 16000000;
var ZOOM_STEPS = [1, 1.25, 1.5, 2, 2.5, 3];

var $ = function (id) { return document.getElementById(id); };
var viewer = $('viewer-container');
var pdfPagesEl = $('pdf-pages');
var emptyState = $('empty-state');
var statusEl = $('status');
var zoomLabel = $('zoom-label');
var fileInput = $('file-input');
var panel = $('translation-panel');
var mask = $('drawer-mask');
var sourceTextBox = $('source-text');
var resultBox = $('translation-result');
var targetLang = $('target-lang');
var engineLabel = $('engine-label');
var toastEl = $('toast');
var selModeBtn = $('sel-mode-btn');

var state = {
    pdf: null, total: 0, fitScale: 1, zoom: 1, zoomIdx: 0,
    dims: [], rendered: new Set(), rendering: new Set(),
    observer: null, reqId: 0,
    pageText: {} 
};

var selMode = false;
var selStartHit = null;

/* ================= 工具 ================= */
function setStatus(msg) { statusEl.textContent = msg; }

var toastTimer = null;
function toast(msg, ms) {
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toastEl.classList.remove('show'); }, ms || 2000);
}

function updateZoomLabel() { zoomLabel.textContent = Math.round(state.zoom * 100) + '%'; }

function clearHl() {
    var list = pdfPagesEl.querySelectorAll('.hl-box');
    for (var i = 0; i < list.length; i++) list[i].remove();
}

/* ================= 加载 PDF ================= */
fileInput.addEventListener('change', async function (e) {
    var file = e.target.files && e.target.files[0];
    if (!file) return;
    e.target.value = '';
    setStatus('加载中…');
    try {
        var buf = await file.arrayBuffer();
        await loadPDF(new Uint8Array(buf));
    } catch (err) {
        console.error(err);
        setStatus('加载失败');
        toast('PDF 加载失败：' + err.message, 3000);
    }
});

async function loadPDF(data) {
    if (state.observer) state.observer.disconnect();
    state.rendered.clear();
    state.rendering.clear();
    state.pageText = {};
    state.zoom = 1;
    state.zoomIdx = 0;
    selMode = false;
    selStartHit = null;
    selModeBtn.classList.remove('active');
    updateZoomLabel();
    pdfPagesEl.innerHTML = '';
    emptyState.style.display = 'none';

    var pdf = await pdfjsLib.getDocument({ data: data }).promise;
    state.pdf = pdf;
    state.total = pdf.numPages;

    var page1 = await pdf.getPage(1);
    var vp1 = page1.getViewport({ scale: 1 });
    var availW = Math.max(viewer.clientWidth - 16, 200);
    state.fitScale = Math.min(availW / vp1.width, 2.5);

    state.dims = [];
    for (var i = 1; i <= pdf.numPages; i++) {
        var p = await pdf.getPage(i);
        var vp = p.getViewport({ scale: 1 });
        state.dims.push({ width: vp.width, height: vp.height });
    }

    for (var j = 1; j <= pdf.numPages; j++) {
        var wrapper = document.createElement('div');
        wrapper.className = 'page-wrapper';
        wrapper.dataset.page = j;
        applyWrapperSize(wrapper, j);
        wrapper.innerHTML = '<div class="page-loading">第 ' + j + ' 页</div>';
        pdfPagesEl.appendChild(wrapper);
    }

    setupObserver();
    renderVisible();
    setStatus(pdf.numPages + ' 页');
}

function applyWrapperSize(wrapper, pageNum) {
    var dim = state.dims[pageNum - 1];
    if (!dim) return;
    var s = state.fitScale * state.zoom;
    wrapper.style.width = (dim.width * s) + 'px';
    wrapper.style.height = (dim.height * s) + 'px';
}

/* ================= 渲染页面并提取绝对坐标数据 ================= */
function setupObserver() {
    state.observer = new IntersectionObserver(function (entries) {
        for (var i = 0; i < entries.length; i++) {
            if (entries[i].isIntersecting) renderPage(entries[i].target);
        }
    }, { root: viewer, rootMargin: '400px 0px' });
    var all = pdfPagesEl.querySelectorAll('.page-wrapper');
    for (var k = 0; k < all.length; k++) state.observer.observe(all[k]);
}

function renderVisible() {
    var vr = viewer.getBoundingClientRect();
    var all = pdfPagesEl.querySelectorAll('.page-wrapper');
    for (var i = 0; i < all.length; i++) {
        var r = all[i].getBoundingClientRect();
        if (r.bottom > vr.top - 400 && r.top < vr.bottom + 400) renderPage(all[i]);
    }
}

async function renderPage(wrapper) {
    if (!wrapper || !wrapper.isConnected) return;
    var pageNum = parseInt(wrapper.dataset.page, 10);
    var zoomAtStart = state.zoom;
    var key = pageNum + '@' + zoomAtStart;
    if (state.rendered.has(key) || state.rendering.has(key)) return;
    state.rendering.add(key);

    try {
        var page = await state.pdf.getPage(pageNum);
        var cssScale = state.fitScale * zoomAtStart;
        var renderScale = cssScale * DPR;
        var rvp = page.getViewport({ scale: renderScale });
        var k = 1;
        if (rvp.width > MAX_CANVAS_DIM || rvp.height > MAX_CANVAS_DIM) {
            k = Math.min(MAX_CANVAS_DIM / rvp.width, MAX_CANVAS_DIM / rvp.height);
        }
        if (rvp.width * rvp.height * k * k > MAX_CANVAS_AREA) {
            k = Math.min(k, Math.sqrt(MAX_CANVAS_AREA / (rvp.width * rvp.height)));
        }
        renderScale *= k;
        var renderViewport = page.getViewport({ scale: renderScale });
        var cssViewport = page.getViewport({ scale: cssScale });

        var canvas = document.createElement('canvas');
        canvas.width = Math.floor(renderViewport.width);
        canvas.height = Math.floor(renderViewport.height);
        canvas.style.width = cssViewport.width + 'px';
        canvas.style.height = cssViewport.height + 'px';
        await page.render({ canvasContext: canvas.getContext('2d'), viewport: renderViewport }).promise;

        if (state.zoom !== zoomAtStart || !wrapper.isConnected) return;

        wrapper.innerHTML = '';
        wrapper.appendChild(canvas);
        state.rendered.add(key);

        var textContent = await page.getTextContent();
        
        var textLayer = document.createElement('div');
        textLayer.className = 'text-layer';
        textLayer.style.width = cssViewport.width + 'px';
        textLayer.style.height = cssViewport.height + 'px';
        await pdfjsLib.renderTextLayer({
            textContentSource: textContent,
            container: textLayer,
            viewport: cssViewport,
            textDivs: []
        }).promise;
        wrapper.appendChild(textLayer);

        var boxes = [];
        textContent.items.forEach(function(item) {
            if (!item.str || item.str.trim() === '') return;
            var tx = pdfjsLib.Util.transform(cssViewport.transform, item.transform);
            var fontHeight = Math.hypot(tx[2], tx[3]);
            
            boxes.push({
                str: item.str,
                left: tx[4],
                top: tx[5] - fontHeight, 
                width: item.width * cssScale,
                height: fontHeight * 1.2 
            });
        });
        state.pageText[pageNum] = boxes;
        
    } catch (err) {
        console.error('渲染第 ' + pageNum + ' 页失败', err);
    } finally {
        state.rendering.delete(key);
    }
}

/* ================= 缩放 ================= */
$('zoom-in').addEventListener('click', function () { changeZoom(1); });
$('zoom-out').addEventListener('click', function () { changeZoom(-1); });

function changeZoom(dir) {
    if (!state.pdf) return;
    var idx = Math.max(0, Math.min(ZOOM_STEPS.length - 1, state.zoomIdx + dir));
    if (idx === state.zoomIdx) return;
    state.zoomIdx = idx;
    state.zoom = ZOOM_STEPS[idx];
    state.rendered.clear();
    state.rendering.clear();
    updateZoomLabel();
    var all = pdfPagesEl.querySelectorAll('.page-wrapper');
    for (var i = 0; i < all.length; i++) {
        var w = all[i];
        var n = parseInt(w.dataset.page, 10);
        applyWrapperSize(w, n);
        w.innerHTML = '<div class="page-loading">第 ' + n + ' 页</div>';
    }
    renderVisible();
}

/* ================= 单词扩展 ================= */
var HAN_RE = /[\u4e00-\u9fff\u3040-\u30ff\uac00-\ud7af]/;
var WORD_RE = /[A-Za-z0-9\u00C0-\u024F'\u2019\-]/;

function expandToWord(text, idx) {
    var len = text.length;
    if (idx < 0 || idx >= len) return '';
    var ch = text[idx];

    if (HAN_RE.test(ch)) {
        var s = idx, e = idx + 1;
        var left = 1, right = 2;
        while (s > 0 && left > 0 && HAN_RE.test(text[s - 1])) { s--; left--; }
        while (e < len && right > 0 && HAN_RE.test(text[e])) { e++; right--; }
        return text.slice(s, e);
    }

    if (!WORD_RE.test(ch)) {
        var l = idx, r = idx;
        while (l >= 0 && !WORD_RE.test(text[l])) l--;
        while (r < len && !WORD_RE.test(text[r])) r++;
        if (l < 0 && r >= len) return ch;
        if (r < len && (l < 0 || (r - idx) <= (idx - l))) {
            idx = r; ch = text[idx];
        } else if (l >= 0) {
            idx = l; ch = text[idx];
        }
    }

    var ws = idx, we = idx + 1;
    while (ws > 0 && WORD_RE.test(text[ws - 1])) ws--;
    while (we < len && WORD_RE.test(text[we])) we++;
    return text.slice(ws, we);
}

/* ================= 点击处理 ================= */
function handleTap(x, y) {
    var wrapper = null;
    var wrappers = pdfPagesEl.querySelectorAll('.page-wrapper');
    for (var i = 0; i < wrappers.length; i++) {
        var r = wrappers[i].getBoundingClientRect();
        if (x >= r.left && x <= r.right && y >= r.top && y <= r.bottom) {
            wrapper = wrappers[i]; break;
        }
    }
    if (!wrapper) return;

    var pageNum = parseInt(wrapper.dataset.page, 10);
    var boxes = state.pageText[pageNum];
    if (!boxes || boxes.length === 0) return;

    var wr = wrapper.getBoundingClientRect();
    var localX = x - wr.left;
    var localY = y - wr.top;

    var bestBox = null;
    var minDist = Infinity;

    for (var j = 0; j < boxes.length; j++) {
        var b = boxes[j];
        var cx = Math.max(b.left, Math.min(localX, b.left + b.width));
        var cy = Math.max(b.top, Math.min(localY, b.top + b.height));
        var d = Math.hypot(localX - cx, localY - cy);
        if (d < minDist) { minDist = d; bestBox = b; }
    }

    if (!bestBox || minDist > 40) return;

    var ratio = (localX - bestBox.left) / bestBox.width;
    ratio = Math.max(0, Math.min(ratio, 0.999));
    var idx = Math.floor(ratio * bestBox.str.length);

    if (selMode) {
        if (!selStartHit) {
            clearHl();
            selStartHit = { box: bestBox, idx: idx, wrapper: wrapper };
            
            var hlStart = document.createElement('div');
            hlStart.className = 'hl-box start';
            hlStart.style.left = bestBox.left + 'px';
            hlStart.style.top = bestBox.top + 'px';
            hlStart.style.width = bestBox.width + 'px';
            hlStart.style.height = bestBox.height + 'px';
            wrapper.appendChild(hlStart);
            
            toast('已选起点，再点终点', 1800);
        } else {
            var startHit = selStartHit;
            selStartHit = null;
            var rangeText = getRangeTextBetween(pageNum, startHit, { box: bestBox, idx: idx });
            clearHl();
            if (!rangeText) { toast('区间内没有文字'); return; }
            translateText(rangeText);
        }
        return;
    }

    var word = expandToWord(bestBox.str, idx);
    if (!word) word = bestBox.str.trim().slice(0, 50);
    if (word.length > 100) word = word.slice(0, 100);

    clearHl();
    var wordStart = bestBox.str.indexOf(word);
    if (wordStart >= 0) {
        var wRatioS = wordStart / bestBox.str.length;
        var wRatioE = (wordStart + word.length) / bestBox.str.length;
        var hl = document.createElement('div');
        hl.className = 'hl-box';
        hl.style.left = (bestBox.left + bestBox.width * wRatioS) + 'px';
        hl.style.top = bestBox.top + 'px';
        hl.style.width = (bestBox.width * (wRatioE - wRatioS)) + 'px';
        hl.style.height = bestBox.height + 'px';
        wrapper.appendChild(hl);
    }

    toast('已选：' + word, 1500);
    translateText(word);
}

function getRangeTextBetween(pageNum, startHit, endHit) {
    var boxes = state.pageText[pageNum];
    var i1 = boxes.indexOf(startHit.box);
    var i2 = boxes.indexOf(endHit.box);
    if (i1 < 0 || i2 < 0) return '';
    if (i1 > i2) {
        var t = i1; i1 = i2; i2 = t;
        var t2 = startHit; startHit = endHit; endHit = t2;
    }

    var parts = [];
    for (var i = i1; i <= i2; i++) {
        var txt = boxes[i].str;
        if (i === i1 && i === i2) {
            var s = Math.min(startHit.idx, endHit.idx);
            var e = Math.max(startHit.idx, endHit.idx) + 1;
            txt = txt.slice(s, e);
        } else if (i === i1) {
            txt = txt.slice(startHit.idx);
        } else if (i === i2) {
            txt = txt.slice(0, endHit.idx + 1);
        }
        txt = txt.replace(/\s+/g, ' ').trim();
        if (txt) parts.push(txt);
    }
    return parts.join(' ');
}

/* ================= 触摸事件 ================= */
var touchStart = null;
var lastTouchAt = 0;

pdfPagesEl.addEventListener('touchstart', function (e) {
    if (e.touches.length !== 1) { touchStart = null; return; }
    var t = e.touches[0];
    touchStart = { x: t.clientX, y: t.clientY, time: Date.now(), moved: false };
}, { passive: true });

pdfPagesEl.addEventListener('touchmove', function (e) {
    if (!touchStart) return;
    var t = e.touches[0];
    if (Math.hypot(t.clientX - touchStart.x, t.clientY - touchStart.y) > 10) {
        touchStart.moved = true;
    }
}, { passive: true });

pdfPagesEl.addEventListener('touchend', function (e) {
    if (!touchStart) return;
    var info = touchStart;
    touchStart = null;
    if (info.moved) return;
    if (Date.now() - info.time > 500) return;

    if (e.cancelable) e.preventDefault();
    var t = e.changedTouches[0];
    lastTouchAt = Date.now();
    handleTap(t.clientX, t.clientY);
}, { passive: false });

pdfPagesEl.addEventListener('touchcancel', function () { touchStart = null; }, { passive: true });

pdfPagesEl.addEventListener('click', function (e) {
    if (Date.now() - lastTouchAt < 600) return;
    handleTap(e.clientX, e.clientY);
});

/* ================= 选段模式按钮 ================= */
selModeBtn.addEventListener('click', function () {
    selMode = !selMode;
    selStartHit = null;
    clearHl();
    selModeBtn.classList.toggle('active', selMode);
    if (selMode) toast('选段模式：点起点，再点终点', 2200);
    else toast('已退出选段模式', 1400);
});

/* ================= 翻译引擎调度 ================= */
async function translateText(text) {
    if (!text) return;
    openPanel(text);
    var reqId = ++state.reqId;
    var lang = targetLang.value;
    setResult('翻译中…', 'loading');
    engineLabel.textContent = '';

    // 桌面端优先尝试内置
    if (isDesktopChrome()) {
        try {
            var r = await translateBuiltin(text, lang);
            if (reqId !== state.reqId) return;
            setResult(r);
            engineLabel.textContent = '浏览器内置 AI';
            return;
        } catch (err) { console.warn('内置翻译失败：', err.message); }
    }

    // 1. 首选：社区 LibreTranslate 节点（国内直连最快）
    try {
        var r1 = await translateLibre(text, lang);
        if (reqId !== state.reqId) return;
        setResult(r1);
        engineLabel.textContent = 'LibreTranslate';
        return;
    } catch (err1) { console.warn('LibreTranslate 失败，切换 MyMemory：', err1.message); }

    // 2. 备选：MyMemory
    try {
        var r2 = await translateMyMemory(text, lang);
        if (reqId !== state.reqId) return;
        setResult(r2);
        engineLabel.textContent = 'MyMemory';
        return;
    } catch (err2) { console.warn('MyMemory 失败，切换 Google：', err2.message); }

    // 3. 兜底：Google 翻译
    try {
        var r3 = await translateGoogle(text, lang);
        if (reqId !== state.reqId) return;
        setResult(r3);
        engineLabel.textContent = 'Google 翻译';
    } catch (err3) {
        if (reqId !== state.reqId) return;
        setResult('所有翻译引擎都请求失败了，请检查网络连接。\n\n' + err3.message, 'error');
    }
}

function isDesktopChrome() {
    return 'Translator' in self && !/Mobi|Android|iPhone|iPad/i.test(navigator.userAgent);
}

async function translateBuiltin(text, lang) {
    var source = detectSourceLang(text);
    if (source === lang) return text;
    var availability = await Translator.availability({ sourceLanguage: source, targetLanguage: lang });
    if (availability === 'unavailable') throw new Error('内置模型不可用');
    var translator = await Translator.create({
        sourceLanguage: source, targetLanguage: lang
    });
    return translator.translate(text);
}

function detectSourceLang(text) {
    if (/[\u4e00-\u9fff]/.test(text)) return 'zh';
    if (/[\u3040-\u30ff]/.test(text)) return 'ja';
    if (/[\uac00-\ud7af]/.test(text)) return 'ko';
    return 'en';
}

async function translateLibre(text, lang) {
    var res = await fetch('https://translate.envs.net/translate', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ q: text.slice(0, MAX_TEXT), source: 'auto', target: lang, format: 'text' })
    });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    var data = await res.json();
    if (!data.translatedText) throw new Error('返回格式异常');
    return data.translatedText;
}

async function translateMyMemory(text, lang) {
    var source = detectSourceLang(text);
    if (source === lang) return text;
    var pair = source + '|' + lang;
    var url = 'https://api.mymemory.translated.net/get?q=' +
        encodeURIComponent(text.slice(0, 500)) +
        '&langpair=' + encodeURIComponent(pair);
    var res = await fetch(url);
    if (!res.ok) throw new Error('HTTP ' + res.status);
    var data = await res.json();
    if (data.responseStatus !== 200 || !data.responseData) {
        throw new Error(data.responseDetails || 'MyMemory 返回异常');
    }
    return data.responseData.translatedText;
}

async function translateGoogle(text, lang) {
    var source = detectSourceLang(text);
    if (source === lang) return text;
    var targetG = lang === 'zh' ? 'zh-CN' : lang;
    
    var url = 'https://translate.googleapis.com/translate_a/single?client=gtx&sl=' + 
              source + '&tl=' + targetG + '&dt=t&q=' + encodeURIComponent(text.slice(0, 3000));
              
    var res = await fetch(url);
    if (!res.ok) throw new Error('HTTP ' + res.status);
    var data = await res.json();
    
    if (!data || !data[0] || !data[0][0] || !data[0][0][0]) {
        throw new Error('Google 返回格式异常');
    }
    
    var translated = '';
    for (var i = 0; i < data[0].length; i++) {
        if (data[0][i] && data[0][i][0]) translated += data[0][i][0];
    }
    return translated;
}

function setResult(text, type) {
    resultBox.className = 'result-box' + (type ? ' ' + type : '');
    resultBox.textContent = text;
    resultBox.scrollTop = 0;
}

/* ================= 抽屉 ================= */
function openPanel(srcText) {
    sourceTextBox.textContent = srcText.length > 600 ? srcText.slice(0, 600) + '…' : srcText;
    sourceTextBox.scrollTop = 0;
    panel.classList.add('visible');
    mask.classList.add('visible');
}
function closePanel() {
    panel.classList.remove('visible');
    mask.classList.remove('visible');
}
$('panel-close').addEventListener('click', closePanel);
mask.addEventListener('click', closePanel);

/* ================= 复制 ================= */
$('copy-btn').addEventListener('click', async function () {
    var text = resultBox.textContent;
    if (!text) return;
    try { await navigator.clipboard.writeText(text); toast('已复制'); }
    catch (err) { toast('复制失败'); }
});

/* ================= 尺寸变化 ================= */
var resizeTimer = null;
window.addEventListener('resize', function () {
    if (!state.pdf) return;
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(function () {
        var availW = Math.max(viewer.clientWidth - 16, 200);
        var dim = state.dims[0];
        if (!dim) return;
        state.fitScale = Math.min(availW / dim.width, 2.5);
        state.rendered.clear();
        state.rendering.clear();
        state.pageText = {};
        var all = pdfPagesEl.querySelectorAll('.page-wrapper');
        for (var i = 0; i < all.length; i++) {
            var w = all[i];
            var n = parseInt(w.dataset.page, 10);
            applyWrapperSize(w, n);
            w.innerHTML = '<div class="page-loading">第 ' + n + ' 页</div>';
        }
        renderVisible();
    }, 280);
});

})();
</script>
